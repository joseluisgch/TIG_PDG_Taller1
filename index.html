    // ===================== 2. MAPA =====================
    // TAREA 2: cambie el centro [latitud, longitud] y el zoom inicial para que el mapa abra sobre su región.
    //          Zoom 5 = todo el Perú · 8 = un departamento · 12 = una ciudad
    const mapa = L.map("mapa").setView([-12.10, -77.019], 8);

    // ===================== 3. MAPAS BASE (servicios de teselas) =====================
    const osm = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd", maxZoom: 19, attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
    });
    const topo = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
      maxZoom: 17, attribution: "&copy; OpenStreetMap, SRTM | estilo &copy; OpenTopoMap (CC-BY-SA)"
    });
    // TAREA 6: agregue un mapa base de imágenes satelitales. Quite las dos barras // de las líneas siguientes
    //          y agregue  "Imágenes": satelite  dentro del control de capas (bloque 5).
    const satelite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19, attribution: "Imágenes &copy; Esri, Maxar, Earthstar Geographics"
    }).addTo(mapa);

    // ===================== 4. CAPA OPERACIONAL =====================
    // TAREA 3: cambie el color de los puntos (formato #RRGGBB, por ejemplo "#1F7A6E" o "#B8483A")
    const COLOR_PUNTOS = "#0000FF";


    // Simbología graduada por población
    function simboloPoblacion(p) {
      if (p > 8000000) {
        return { radio: 19, color: "#C00000" };
      } else if (p > 500000) {
        return { radio: 15, color: "#FF0000" };
      } else if (p > 100000) {
        return { radio: 11, color: "#FFD000" };
      } else if (p > 50000) {
        return { radio: 8, color: "#FFFF00" };
      } else {
        return { radio: 5, color: "#00D000" };
      }
    }

    // RETO DEL TALLER 1: segunda capa operacional (polígonos), resaltado al pasar el cursor y leyenda.
    // Polígonos: relleno suave, borde visible y resaltado al pasar el cursor
    const estiloDep = { color: "#FFFFFF", weight: 1, fillColor: "#1F7A6E", fillOpacity: 0.12 };
    const capaDep = L.geoJSON(departamentos, {
      style: estiloDep,
      onEachFeature: (f, capa) => {
        capa.bindTooltip(f.properties.departamento, { sticky: true });
        capa.on({
          mouseover: e => e.target.setStyle({ weight: 3, fillOpacity: 0.3 }),
          mouseout: e => capaDep.resetStyle(e.target),
          click: e => mapa.fitBounds(e.target.getBounds())
        });
      }
    }).addTo(mapa);


    // Puntos encima de los polígonos
    const capaCiudades = L.geoJSON(ciudades, {
      pointToLayer: (f, latlng) => {
        const s = simboloPoblacion(f.properties.poblacion_est);

        return L.circleMarker(latlng, {
          radius: s.radio,
          color: "#666666",
          weight: 1,
          fillColor: s.color,
          fillOpacity: 0.95
        });
      },

      // TAREA 4: agregue la categoría a la ventana emergente. Pista: f.properties.categoria
      onEachFeature: (f, capa) => capa.bindPopup(
        "<b>" + f.properties.ciudad + "</b>" +
        "<br>Departamento: " + f.properties.departamento +
        "<br>Categoría: " + f.properties.categoria +
        "<br>Población estimada: " +
        f.properties.poblacion_est.toLocaleString("es-PE")
      )
    }).addTo(mapa);

    // TAREA 5: agregue un marcador en su institución o centro de trabajo. Quite las barras // y cambie
    //          las coordenadas (cópielas de ArcGIS Online o de Google Maps: clic derecho sobre el lugar).
    L.marker([-12.10089152109458, -77.01929208135005]).bindPopup("<b>Ministerio de Vivienda Construcción y Saneamiento </b>").addTo(mapa);

    // ===================== 5. CONTROLES =====================
    L.control.layers(
      { "Mapa claro (CARTO)": osm, "OpenTopoMap": topo, "Imágenes": satelite },       // mapas base: se elige uno
      { "Departamentos": capaDep, "Ciudades": capaCiudades } // capas operacionales: se encienden y apagan
    ).addTo(mapa);
    L.control.scale({ imperial: false }).addTo(mapa);

    // ===================== 6. LEYENDA DE POBLACIÓN =====================
    // Leyenda según la simbología graduada 

    const leyenda = L.control({ position: "bottomright" });

    leyenda.onAdd = () => {
      const div = L.DomUtil.create("div", "caja");

      const rangos = [
        { texto: "> 8.000.000", poblacion: 8000001 },
        { texto: "> 500.000 - 8.000.000", poblacion: 500001 },
        { texto: "> 100.000 - 500.000", poblacion: 100001 },
        { texto: "> 50.000 - 100.000", poblacion: 50001 },
        { texto: "0 - 50.000", poblacion: 50000 }
      ];

      div.innerHTML = "<h2>Población estimada</h2>" +
        rangos.map(r => {
          const s = simboloPoblacion(r.poblacion);
          const d = s.radio * 2;

          return `
            <div style="display:flex;align-items:center;
                        gap:10px;min-height:44px;margin:3px 0;">
              <span style="display:inline-block;
                           width:${d}px;height:${d}px;
                           flex-shrink:0;border-radius:50%;
                           background:${s.color};
                           border:1px solid #666;">
              </span>
              <span>${r.texto}</span>
            </div>
          `;
        }).join("");

      return div;
    };

    leyenda.addTo(mapa);
  </script>
</body>

</html>
